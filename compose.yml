services:
  postgres:
    image: postgres:17-alpine
    container_name: stockflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow_dev_pw
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - stockflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine # Redis 7 기반 경량 이미지
    container_name: stockflow-redis
    ports:
      - "127.0.0.1:6380:6379" # 로컬 PC의 56379 포트를 Redis에 연결
    volumes:
      - stockflow_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"] # Redis AOF 영속성 활성화
    healthcheck: # Redis 정상 응답 확인
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    # RabbitMQ 공식 Docker 이미지에는 관리 화면이 포함된 management-alpine 변형이 제공
    image: rabbitmq:4.3-management-alpine
    container_name: stockflow-rabbitmq
    hostname: stockflow-rabbitmq
    ports:
      - "127.0.0.1:5673:5672"   # Spring Boot에서 RabbitMQ에 연결
      - "127.0.0.1:15673:15672" # RabbitMQ 웹 관리 화면
    environment:
      RABBITMQ_DEFAULT_USER: stockflow
      RABBITMQ_DEFAULT_PASS: stockflow_dev_pw
    volumes:
      - stockflow_rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  stockflow_pgdata:
  stockflow_redisdata: # Redis 데이터 저장용 볼륨
  stockflow_rabbitmqdata: